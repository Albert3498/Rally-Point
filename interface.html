<!doctype html>
<html lang="ro">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RallyPoint · Acasă</title>
  <meta name="description" content="Oportunități de voluntariat pentru elevi de 14–18 ani din România: alege după oraș, vârstă și program și aplică direct.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/site.css">
  <link rel="stylesheet" href="css/oportunitati.css">
  <link rel="stylesheet" href="css/descopera.css">
  <link rel="icon" type="image/png" href="RallyPoint.jpeg">
</head>

<body>
  <a class="skip-link" href="#views">Sari la conținut</a>

  <header class="site-header">
    <div class="container nav">
      <a class="logo" href="#/home" aria-label="RallyPoint, pagina de start">RallyPoint</a>
      <nav id="nav" aria-label="Navigare principală"></nav>
      <div id="account" class="account"></div>
    </div>
  </header>

  <!-- Each page is a "view": see js/core.js. The home page builds itself in js/features/home.js. -->
  <main id="views" tabindex="-1">
    <div class="view" id="view-home"></div>
  </main>

  <footer>
    <div class="container">
      RallyPoint: platformă de voluntariat pentru elevi. Detaliile fiecărei activități trebuie confirmate cu organizatorul ei.
    </div>
  </footer>

  <!-- Settings (read by core.js and the features):
       apiBase       - address of the API (default http://127.0.0.1:8000)
       eventsSource  - 'sample' = opportunities from demo_data.json, 'api' = real events from GET /events/
       applySource   - 'mock' = demo only (the server has no applications endpoint yet), 'api' = real endpoint (not built yet) -->
  <script>window.APP_CONFIG = { eventsSource: 'sample', applySource: 'mock' };</script>
  <script src="js/core.js"></script>

  <!-- Features. To add one: create js/features/<name>.js and list it here (see the header of js/core.js). -->
  <script src="js/data/exemple-evenimente.js"></script>
  <script src="js/features/evenimente.js"></script>
  <script src="js/features/descopera.js"></script>
  <script src="js/features/home.js"></script>
  <script src="js/features/aplica.js"></script>
  <script src="js/features/auth.js"></script>
  <script src="js/features/volunteers.js"></script>
  <script src="js/features/request-card.js"></script>
  <script src="js/features/request-event.js"></script>
  <script src="js/features/my-requests.js"></script>
  <script src="js/features/admin-review.js"></script>
  <!-- boot happens automatically on DOMContentLoaded -->
</body>

</html>
